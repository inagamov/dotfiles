# ============================================================
#  General
# ============================================================

set -g prefix F2
unbind C-b
bind F2 send-prefix

set -g default-terminal "tmux-256color"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off

set -g mouse on
setw -g mode-keys vi

# ============================================================
#  Keybindings
# ============================================================

bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind s choose-tree -s

# pane navigation
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# pane resizing
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 3
bind -r Down resize-pane -D 3

# windows / panes / sessions
bind n new-window
bind Enter split-window -h
bind S-Enter split-window -v
bind w kill-pane
bind q kill-window
bind d detach
bind Q confirm-before -p "Kill entire session? (y/n)" kill-session

# ============================================================
#  Appearance
# ============================================================

set -g status-position top
set -g pane-border-lines "double"

# full-width prompt/message strip (tmux 3.7 overlays the status line by default;
# `fill` clears it — set via message-format, which plugins never touch)
set -g message-format '#[fill=#0a0b0f,bg=#0a0b0f,fg=#c2c0b8,align=centre]#{message}'

# ============================================================
#  Plugins
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-fg-prefix "#83b560"
set -g @tmux-dotbar-position top
set -g @tmux-dotbar-rounded true
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-window-status-separator " • "

run '~/.tmux/plugins/tpm/tpm'
