# ============================================================
#  General
# ============================================================

set -g prefix F2
unbind C-b
bind F2 send-prefix

set -g default-terminal "tmux-256color"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off

set -g mouse on
setw -g mode-keys vi

# ============================================================
#  Keybindings
# ============================================================

bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind s choose-tree -s

# copy mode (vim-like)
bind v copy-mode
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi f command-prompt -T search -p "(search down)" { send-keys -X search-forward "%%" }
bind -T copy-mode-vi F command-prompt -T search -p "(search up)" { send-keys -X search-backward "%%" }
unbind [
unbind -T copy-mode-vi Space
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi q
unbind -T copy-mode-vi /
unbind -T copy-mode-vi ?

# pane navigation
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# pane resizing
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 3
bind -r Down resize-pane -D 3

# windows / panes / sessions
bind n new-window
bind N new-session
bind Enter split-window -h -c "#{pane_current_path}"
bind S-Enter split-window -v -c "#{pane_current_path}"
bind w kill-pane
bind q kill-window
bind d detach
bind Q confirm-before -p "Kill entire session? (y/n)" kill-session

# ============================================================
#  Appearance
# ============================================================

set -g pane-border-lines double

%hidden THEME="dark"

%if "#{==:${THEME},gruvbox}"
  %hidden ACCENT="#C89726"
  %hidden FG="#B4A889"
  %hidden FG_DIM="#524A44"
  %hidden FADE1="#363331"
  %hidden FADE2="#443F3B"
  %hidden BG="#282828"
%elif "#{==:${THEME},dark}"
  %hidden ACCENT="#C8C8C8"
  %hidden FG="#C8C8C8"
  %hidden FG_DIM="#3A3A3A"
  %hidden FADE1="#1A1A1A"
  %hidden FADE2="#262626"
  %hidden BG="#0F0F0F"
%else
  %hidden ACCENT="#BF68D9"
  %hidden FG="#ABB2BF"
  %hidden FG_DIM="#3B3F4C"
  %hidden FADE1="#2A2D36"
  %hidden FADE2="#33363F"
  %hidden BG="#1E2127"
%endif

%hidden ZOOM_ICON="󰊓"

set -g mode-style "bg=${FG_DIM},fg=${FG}"
set -g message-style "bg=${FG_DIM},fg=${FG}"
set -g message-command-style "bg=${FG_DIM},fg=${ACCENT}"

set -g pane-border-style "fg=${FG_DIM}"
set -g pane-active-border-style "fg=${ACCENT}"

set -g status-position top
set -g status-style "bg=default,fg=${FG}"
set -g status-justify absolute-centre

set -g status-left-length 100
set -g status-left "#{?client_prefix,#[bg=${ACCENT}]#[fg=${BG}],} #S "
set -g status-right " %d-%b %H:%M "

set -g window-status-separator ""

set -g window-status-format "\
 #I\
#[fg=${FG_DIM}].#W\
#{?window_zoomed_flag, ${ZOOM_ICON},}\
 "

set -g window-status-current-format "\
#[bg=${FADE1}] #[bg=${FADE2}] \
#[bg=${FG_DIM}] #I.#W\
#{?window_zoomed_flag,#[fg=${ACCENT}] ${ZOOM_ICON},} \
#[bg=${FADE2}] #[bg=${FADE1}] \
"

# ============================================================
#  Plugins
# ============================================================

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-hook-post-save-all 'dir="$(resurrect_dir)"; if [ -f "$dir/last" ]; then for file in "$dir"/tmux_resurrect_*.txt; do if [ -f "$file" ] && ! [ "$file" -ef "$dir/last" ]; then rm -f -- "$file"; fi; done; fi'

set -g @continuum-restore 'off'
set -g @continuum-save-interval '0'

run '~/.tmux/plugins/tpm/tpm'
