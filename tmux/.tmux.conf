# ============================================================
#  General
# ============================================================

set -g prefix F2
unbind C-b
bind F2 send-prefix

set -g default-terminal "tmux-256color"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off

set -g mouse on
setw -g mode-keys vi

# ============================================================
#  Keybindings
# ============================================================

bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind s choose-tree -s

# copy mode (vim-like)
bind v copy-mode
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi f command-prompt -T search -p "(search down)" { send-keys -X search-forward "%%" }
bind -T copy-mode-vi F command-prompt -T search -p "(search up)" { send-keys -X search-backward "%%" }
unbind [
unbind -T copy-mode-vi Space
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi q
unbind -T copy-mode-vi /
unbind -T copy-mode-vi ?

# pane navigation
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# pane resizing
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 3
bind -r Down resize-pane -D 3

# windows / panes / sessions
bind n new-window
bind N new-session
bind Enter split-window -h
bind S-Enter split-window -v
bind w kill-pane
bind q kill-window
bind d detach
bind Q confirm-before -p "Kill entire session? (y/n)" kill-session

# ============================================================
#  Appearance
# ============================================================

set -g pane-border-lines "double"

RED="#ea6962"
GREEN="#a9b665"
YELLOW="#d8a657"
BLUE="#7daea3"
MAGENTA="#d3869b"
CYAN="#89b482"
BLACK="#1d2021"
DARK_GRAY="#32302F"
LIGHT_GRAY="#4F4946"
BG="#32302F"
FG="#d4be98"

HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"
TRIANGLE_OPEN="#(printf '\uE0B2')"
TRIANGLE_CLOSE="#(printf '\uE0B0')"
ZOOM_ICON="󰊓"

set -g status-position top
set-option -g status-style bg=${BG},fg=${FG}
set-option -g status-justify centre
set-option -g window-status-separator ""

set-option -g status-left "\
#{?client_prefix,#[fg=${YELLOW}],#[fg=${LIGHT_GRAY}]}#[bg=default]${HALF_ROUND_OPEN}\
#{?client_prefix,#[bg=${YELLOW}]#[fg=${LIGHT_GRAY}],#[bg=${LIGHT_GRAY}]#[fg=${YELLOW}]}#S\
#{?client_prefix,#[fg=${YELLOW}],#[fg=${LIGHT_GRAY}]}#[bg=default]${HALF_ROUND_CLOSE}\
"

set-option -g status-right "\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_OPEN}\
#[bg=${LIGHT_GRAY},fg=${CYAN}]%d-%b %H:%M\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_CLOSE}\
"

set-option -g status-left-length 100
set-option -g status-right-length 100

set-option -g window-status-format "\
 \
#I\
#[fg=${LIGHT_GRAY}]:\
#[fg=${LIGHT_GRAY}]#W\
#{?window_zoomed_flag, ${ZOOM_ICON},}\
 \
"

set-option -g window-status-current-format "\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_OPEN}\
#[bg=${LIGHT_GRAY},fg=default]#I\
#[fg=${YELLOW}]:\
#[fg=default]#W\
#[fg=${YELLOW}]#{?window_zoomed_flag, ${ZOOM_ICON},}\
#[fg=${LIGHT_GRAY},bg=default]${HALF_ROUND_CLOSE}\
"


# ============================================================
#  Plugins
# ============================================================

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-hook-post-save-all 'dir="$(resurrect_dir)"; if [ -f "$dir/last" ]; then for file in "$dir"/tmux_resurrect_*.txt; do if [ -f "$file" ] && ! [ "$file" -ef "$dir/last" ]; then rm -f -- "$file"; fi; done; fi'

set -g @continuum-restore 'off'
set -g @continuum-save-interval '0'

run '~/.tmux/plugins/tpm/tpm'
